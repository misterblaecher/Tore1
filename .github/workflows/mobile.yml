name: Mobile release gate

on:
  push:
    branches: [main]
    paths:
      - 'tore/app/**'
      - 'scripts/rc_verify_mobile.sh'
      - 'scripts/rc_grep_pii.sh'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'tore/app/**'
      - 'scripts/rc_verify_mobile.sh'
      - 'scripts/rc_grep_pii.sh'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

jobs:
  mobile-release-gate:
    name: Flutter quality and Android smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tore/app
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for Android builds
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Android debug smoke (dev)
        run: flutter build apk --debug --flavor dev --dart-define=TORE_ENV=dev
      - name: Reclaim debug build space
        run: |
          flutter clean
          flutter pub get
          df -h /
      - name: Android release smoke (dev)
        run: flutter build apk --release --flavor dev --dart-define=TORE_ENV=dev
