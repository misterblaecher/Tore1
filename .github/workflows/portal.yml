name: Portal CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portal-build:
    name: Portal build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tore-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tore-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

  structures-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tore_site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tore_site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
