name: Portal CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  portal-build:
    name: Portal build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tore-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tore-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

  structures-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tore_site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tore_site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build

  structures-e2e:
    name: Forum security E2E and accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tore_site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tore_site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tore-backend/requirements.txt
      - name: Install backend dependencies
        working-directory: tore-backend
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run security and accessibility journeys
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: forum-playwright-report
          path: tore_site/playwright-report
          retention-days: 14
