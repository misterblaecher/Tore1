name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tore-backend
    env:
      DATABASE_URL: sqlite:///./ci.db
      TORE_JWT_SECRET: ci-jwt-secret
      TORE_SECRET: ci-app-secret
      ORDER_QR_SECRET: ci-qr-secret
      TORE_CORS_ORIGINS: http://localhost:5173
      TORE_RATE_LIMIT_MAX: "120"
      TORE_RATE_LIMIT_WINDOW_S: "60"
      TORE_AUTO_DB_BOOTSTRAP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tore-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  migration-check:
    name: Alembic sanity check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tore-backend
    env:
      DATABASE_URL: sqlite:///./alembic_ci.db
      TORE_JWT_SECRET: ci-jwt-secret
      TORE_SECRET: ci-app-secret
      ORDER_QR_SECRET: ci-qr-secret
      TORE_CORS_ORIGINS: http://localhost:5173
      TORE_RATE_LIMIT_MAX: "120"
      TORE_RATE_LIMIT_WINDOW_S: "60"
      TORE_AUTO_DB_BOOTSTRAP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tore-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Alembic import sanity
        run: python -c "from alembic.config import Config"

      - name: Alembic upgrade head
        run: python -m alembic upgrade head

  flutter-quality:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tore/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
