name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tore-backend
    env:
      DATABASE_URL: sqlite:///./ci.db
      TORE_JWT_SECRET: ci-jwt-secret
      TORE_SECRET: ci-app-secret
      ORDER_QR_SECRET: ci-qr-secret
      TORE_CORS_ORIGINS: http://localhost:5173
      TORE_RATE_LIMIT_MAX: "120"
      TORE_RATE_LIMIT_WINDOW_S: "60"
      TORE_AUTO_DB_BOOTSTRAP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tore-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  migration-check:
    name: Alembic sanity check (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tore_ci
          POSTGRES_USER: tore
          POSTGRES_PASSWORD: tore
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tore -d tore_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: tore-backend
    env:
      DATABASE_URL: postgresql://tore:tore@127.0.0.1:5432/tore_ci
      TORE_JWT_SECRET: ci-jwt-secret
      TORE_SECRET: ci-app-secret
      ORDER_QR_SECRET: ci-qr-secret
      TORE_CORS_ORIGINS: http://localhost:5173
      TORE_RATE_LIMIT_MAX: "120"
      TORE_RATE_LIMIT_WINDOW_S: "60"
      TORE_AUTO_DB_BOOTSTRAP: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tore-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Alembic import sanity
        run: python -c "from alembic.config import Config"

      - name: Alembic upgrade head on fresh Postgres
        run: python -m alembic upgrade head

      - name: Verify Alembic head
        run: python -m alembic current

      - name: Distributed rate-limit integration (Postgres)
        env:
          TORE_RATE_LIMIT_BACKEND: database
        run: pytest -q tests/test_rate_limit_distributed.py

      - name: PostgreSQL migration matrix
        run: pytest -q tests/test_migration_matrix_postgres.py

      - name: Legacy migration compatibility matrix
        run: pytest -q tests/test_legacy_forum_migration_bridge.py

  flutter-quality:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tore/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
