# Temporary branch-scoped workflow to regenerate npm lockfiles in GitHub's Node environment.
# This workflow will be deleted before merging the pull request.
name: Temporary dependency refresh for PR 315

on:
  push:
    branches:
      - fix/restore-github-actions-2026-11-04
    paths:
      - .github/workflows/dependency-refresh-temporary.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-github-actions-2026-11-04
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh portal dependencies
        working-directory: tore-portal
        run: |
          npm install --no-fund 'react-router-dom@^7.18.5'
          npm audit fix --no-fund || true
      - name: Refresh structures-site dependencies
        working-directory: tore_site
        run: |
          npm install --no-fund 'react-router-dom@^7.18.5' 'zod@^4.6.7'
          npm audit fix --no-fund || true
      - name: Commit refreshed manifests and lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tore-portal/package.json tore-portal/package-lock.json tore_site/package.json tore_site/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): upgrade vulnerable npm dependencies and lockfiles"
            git push origin HEAD:fix/restore-github-actions-2026-11-04
          fi
