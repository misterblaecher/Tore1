name: tore
description: Tore app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # State management
  flutter_riverpod: ^2.6.1

  # Network
  dio: ^5.9.1
  dio_web_adapter: ^2.1.1
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  crypto: ^3.0.3
  google_sign_in: ^6.2.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  default-flavor: dev
  uses-material-design: true

  assets:
    - assets/da/
    - assets/branding/

  fonts: []
  # TODO(TORÈ V1): déclarer Inter et SpaceMono ici dès que les fichiers TTF/OTF
  # seront ajoutés localement (ex: assets/fonts/Inter-*.ttf, assets/fonts/SpaceMono-*.ttf).
