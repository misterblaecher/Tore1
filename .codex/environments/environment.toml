version = 1
name = "Tore"

[setup]
script = ""

[setup.win32]
script = '''
cd /d "%CODEX_WORKTREE_PATH%"

if exist "tore\app\pubspec.yaml" (
  cd tore\app
  flutter pub get
  cd /d "%CODEX_WORKTREE_PATH%"
)

if exist "tore-backend\requirements.txt" (
  cd tore-backend
  python -m pip install -r requirements.txt
